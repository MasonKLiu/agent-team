name: RFC-001 merge gates

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checker & guard self-tests
        run: python -m unittest discover -s tests -v

      - name: 80/20 Adapter sync check (TEAM-007)
        run: python scripts/sync_adapters.py --check

      - name: Agent team structure (TEAM-001..007)
        run: python scripts/check_team.py

      - name: Governance & ratchet (push)
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            python scripts/check_governance.py \
              --changed-from "$BEFORE_SHA" \
              --baseline-ref "$BEFORE_SHA"
          else
            python scripts/check_governance.py
          fi

      - name: Governance & ratchet (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          python scripts/check_governance.py \
            --changed-from "$BASE_REF" \
            --baseline-ref "$BASE_REF"
